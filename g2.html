let mode='mix', started=false, score=0,combo=0,maxCombo=0,hits=0,misses=0,judgeUntil=0,judge='',holding=false,activeLeftSegment=null,leftPointerX=null,leftPointerY=null,leftPointerId=null,handledL=new Set(),handledR=new Set();
const audios={left:document.getElementById('aL'),right:document.getElementById('aR'),mix:document.getElementById('aM')}; let raf=0, startStamp=0;
function activeAudio(){return audios[mode]}
function setMode(m){mode=m;document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('active'));document.getElementById(m==='left'?'mL':m==='right'?'mR':'mM').classList.add('active');prepare()}

async function startGame(){prepare();document.getElementById('startOverlay').style.display='none';started=true;judge='准备';judgeUntil=performance.now()+PRE_ROLL*1000;const a=activeAudio();try{await a.play()}catch(e){console.log(e)};startStamp=performance.now();raf=requestAnimationFrame(loop)}
function now(){const a=activeAudio();return a&&!a.paused?a.currentTime-PRE_ROLL:-PRE_ROLL}
function loop(){const t=now();if(t>=0){processLeftHold(t);autoMiss(t)}draw(t);if(started&&t<DATA.duration-.03)raf=requestAnimationFrame(loop);else if(started)finish()}
function finish(){started=false;holding=false;activeLeftSegment=null;leftPointerX=leftPointerY=leftPointerId=null;const total=hits+misses;document.getElementById('rScore').textContent=score;document.getElementById('rAcc').textContent=(total?Math.round(hits/total*100):100)+'%';document.getElementById('rCombo').textContent=maxCombo;document.getElementById('result').style.display='block'}
function markLeftMiss(id){if(handledL.has(id))return;handledL.add(id);misses++;combo=0;judge='MISS';judgeUntil=performance.now()+260;updateStats()}
function autoMiss(t){if(mode!=='right'){DATA.left_guides.forEach((b,bi)=>b.points.forEach((p,pi)=>{const id=bi+'-'+pi;if(handledL.has(id))return;if(activeLeftSegment===bi&&pi>0)return;if(t-p.t>.24)markLeftMiss(id)}))}if(mode!=='left'){DATA.right_game_events.forEach((e,i)=>{if(!handledR.has(i)&&t-e.t>.24){handledR.add(i);misses++;combo=0}})}updateStats()}
function updateStats(){document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo;const total=hits+misses;document.getElementById('acc').textContent=(total?Math.round(hits/total*100):100)+'%'}
function laneXLeft(pitch,y){const f=Math.max(0,Math.min(1,(pitch-34)/31));const half=270+(HIT_Y-y)/460*(-40);return CX-380+f*290}
function laneXRight(pitch,y){const f=Math.max(0,Math.min(1,(pitch-65)/24));return CX+90+f*310}
function evY(et,t){return HIT_Y-(et-t)/TRAVEL*(HIT_Y-TOP_Y)}
function draw(t){ctx.clearRect(0,0,1280,720);drawTrack();if(mode!=='right')drawLeft(t);if(mode!=='left')drawRight(t);ctx.fillStyle='#f8fafc';ctx.fillRect(145,HIT_Y,990,6);ctx.strokeStyle='#f472b6';ctx.lineWidth=2;ctx.strokeRect(145,HIT_Y-3,990,9);if(performance.now()<judgeUntil){ctx.textAlign='center';ctx.font='900 42px sans-serif';ctx.fillStyle=judge==='准备'?'#f8fafc':judge==='PERFECT'?'#67e8f9':judge==='GOOD'?'#fde047':'#fb7185';ctx.fillText(judge,640,365)}}
function drawTrack(){ctx.save();ctx.fillStyle='rgba(5,12,35,.76)';ctx.beginPath();ctx.moveTo(390,145);ctx.lineTo(890,145);ctx.lineTo(1135,616);ctx.lineTo(145,616);ctx.closePath();ctx.fill();for(let i=0;i<=6;i++){const f=i/6;ctx.strokeStyle=i<=3?'rgba(34,211,238,.30)':'rgba(251,146,60,.30)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(390+500*f,145);ctx.lineTo(145+990*f,616);ctx.stroke()}ctx.restore()}
function drawLeft(t){ctx.lineCap='round';DATA.left_guides.forEach((b,bi)=>{const pts=[];b.points.forEach((p,pi)=>{const y=evY(p.t,t);if(y>TOP_Y-40&&y<HIT_Y+30)pts.push({x:laneXLeft(p.pitch,y),y,id:bi+'-'+pi,handled:handledL.has(bi+'-'+pi)})});if(pts.length>1){ctx.strokeStyle='rgba(56,189,248,.85)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke()}pts.forEach(p=>{const w=62,h=30;ctx.fillStyle=p.handled?'rgba(125,211,252,.35)':'#38bdf8';ctx.shadowBlur=16;ctx.shadowColor='#38bdf8';ctx.fillRect(p.x-w/2,p.y-h/2,w,h);ctx.shadowBlur=0;ctx.strokeStyle='#e0f2fe';ctx.lineWidth=2;ctx.strokeRect(p.x-w/2,p.y-h/2,w,h)})})}
function drawRight(t){DATA.right_game_events.forEach((e,i)=>{const y=evY(e.t,t);if(y<TOP_Y-40||y>HIT_Y+30)return;const x=laneXRight(e.pitch_center,y),w=66,h=26;ctx.fillStyle=handledR.has(i)?'rgba(251,146,60,.35)':'#fb923c';ctx.shadowBlur=15;ctx.shadowColor='#fb923c';ctx.fillRect(x-w/2,y-h/2,w,h);ctx.shadowBlur=0;ctx.strokeStyle='#ffedd5';ctx.lineWidth=2;ctx.strokeRect(x-w/2,y-h/2,w,h)})}
function judgeHit(diff,id,isLeft){let ok=false;if(diff<.11){score+=120+combo*3;combo++;hits++;judge='PERFECT';ok=true}else if(diff<.22){score+=80+combo*2;combo++;hits++;judge='GOOD';ok=true}else{combo=0;misses++;judge='MISS'}maxCombo=Math.max(maxCombo,combo);judgeUntil=performance.now()+380;if(isLeft)handledL.add(id);else handledR.add(id);updateStats();return ok}
function checkLeftStart(x,y,pointerId){if(mode==='right'||!started)return;const t=now();let best=null;DATA.left_guides.forEach((b,bi)=>{const p=b.points[0],id=bi+'-0';if(handledL.has(id))return;const px=laneXLeft(p.pitch,HIT_Y),dt=Math.abs(p.t-t),dist=Math.hypot(px-x,HIT_Y-y);if(dist<130&&dt<.30&&(!best||dt<best.dt))best={dt,id,bi}});if(best){const ok=judgeHit(best.dt,best.id,true);if(ok){activeLeftSegment=best.bi;holding=true;leftPointerId=pointerId;leftPointerX=x;leftPointerY=y}}}
function updateLeftPointer(x,y,pointerId){if(!holding||activeLeftSegment===null||pointerId!==leftPointerId)return;leftPointerX=x;leftPointerY=y}
function processLeftHold(t){if(mode==='right'||activeLeftSegment===null||!holding||leftPointerX===null)return;const b=DATA.left_guides[activeLeftSegment];for(let pi=1;pi<b.points.length;pi++){const p=b.points[pi],id=activeLeftSegment+'-'+pi;if(handledL.has(id))continue;if(t<p.t-.16)break;const targetX=laneXLeft(p.pitch,HIT_Y);if(t<=p.t+.24){const xOk=Math.abs(leftPointerX-targetX)<=110;const yOk=Math.abs(leftPointerY-HIT_Y)<=130;if(xOk&&yOk){judgeHit(Math.abs(t-p.t),id,true);if(pi===b.points.length-1){activeLeftSegment=null;holding=false;leftPointerId=null}break}}else{markLeftMiss(id);if(pi===b.points.length-1){activeLeftSegment=null;holding=false;leftPointerId=null}break}}}
function checkRight(x,y){if(mode==='left'||!started)return;const t=now();let best=null;DATA.right_game_events.forEach((e,i)=>{if(handledR.has(i))return;const py=evY(e.t,t),px=laneXRight(e.pitch_center,py);const dt=Math.abs(e.t-t);const dist=Math.hypot(px-x,py-y);if(dist<112&&(!best||dt<best.dt))best={dt,id:i}});if(best)judgeHit(best.dt,best.id,false)}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1280/r.width,y=(e.clientY-r.top)*720/r.height;if(x<CX){cv.setPointerCapture(e.pointerId);checkLeftStart(x,y,e.pointerId)}else checkRight(x,y)});
cv.addEventListener('pointermove',e=>{if(activeLeftSegment===null)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1280/r.width,y=(e.clientY-r.top)*720/r.height;updateLeftPointer(x,y,e.pointerId)});
function endLeftPointer(e){if(leftPointerId===null||e.pointerId===leftPointerId){holding=false;activeLeftSegment=null;leftPointerX=leftPointerY=leftPointerId=null}}
cv.addEventListener('pointerup',endLeftPointer);cv.addEventListener('pointercancel',endLeftPointer);
Object.values(audios).forEach(a=>a.addEventListener('ended',()=>{if(started)finish()}));prepare();

function fitFrame(){const f=document.getElementById('frame'),s=Math.min(window.innerWidth/1280,window.innerHeight/720);f.style.transform=`scale(${s})`;f.style.width=(1280*s)+'px';f.style.height=(720*s)+'px'}window.addEventListener('resize',fitFrame);window.addEventListener('orientationchange',()=>setTimeout(fitFrame,120));fitFrame();
</script></div></body></html>
