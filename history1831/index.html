<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="index.icon.png"><title>肖邦革命练习曲 · 1831历史沉浸场景</title><style>html,body{margin:0;background:#141310;color:#eee;font-family:system-ui;height:100%;overflow:hidden}#game{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);outline:none;touch-action:none}#cover{position:absolute;inset:0;background:linear-gradient(120deg,#292820,#101416);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;box-sizing:border-box}h1{font-size:clamp(24px,4vw,42px);color:#e7c675}p{line-height:1.8}button{padding:14px 32px;border:1px solid #bb9959;border-radius:8px;background:#88612c;color:white;font-size:20px;cursor:pointer}progress{width:min(80vw,420px);margin:20px;accent-color:#c19c54}#status{white-space:pre-line}#rotate{display:none;position:absolute;top:10px;left:0;right:0;text-align:center;background:#17140ec7;color:#e7c675;padding:8px;pointer-events:none}@media(orientation:portrait){#rotate{display:block}}</style></head><body><div id="game"><canvas id="canvas" width="1280" height="720" tabindex="0"></canvas></div><div id="cover"><div><h1>肖邦《革命练习曲》</h1><p>1831历史沉浸场景 · 当前版本2026-10-05</p><p>电脑：WASD行走，拖动画面转动视角<br>手机：方向按钮行走，拖动画面转动视角，建议横屏</p><button id="start">开始体验</button><br><progress id="progress" hidden></progress><p id="status">首次需要下载场景资源，请保持页面打开。</p></div></div><div id="rotate">手机横屏可获得更清晰的文字和操作视野</div><script src="index.js"></script><script>
const baseFetch=window.fetch.bind(window);let manifest;let received=0;let total=0;const status=document.getElementById('status'),progress=document.getElementById('progress');
window.fetch=async function(input,init){const url=typeof input==='string'?input:input.url;const name=new URL(url,location.href).pathname.split('/').pop();if(manifest&&manifest.files[name]){const file=manifest.files[name];let i=0;const compressed=new ReadableStream({async pull(controller){if(i>=file.parts.length){controller.close();return}const part=file.parts[i++];try{const res=await baseFetch(part.file+"?v="+part.sha256,init);if(!res.ok)throw Error('资源下载失败 '+res.status);const data=await res.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==part.sha256)throw Error('资源校验未通过，请刷新重试');received+=data.byteLength;progress.value=received;status.textContent='正在载入场景 '+Math.round(received/total*100)+'%';controller.enqueue(new Uint8Array(data));}catch(e){controller.error(e)}}});return new Response(compressed.pipeThrough(new DecompressionStream('gzip')),{headers:{'Content-Type':name.endsWith('.wasm')?'application/wasm':'application/octet-stream'}})}return baseFetch(input,init)};
document.getElementById('start').onclick=async()=>{const button=document.getElementById('start');button.disabled=true;progress.hidden=false;try{const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw Error('浏览器缺少 '+missing.join('、')+'，请使用新版Chrome、Safari或Edge。');if(!window.DecompressionStream)throw Error('请更新浏览器后再打开。');manifest=await(await baseFetch('manifest.json')).json();total=Object.values(manifest.files).reduce((a,x)=>a+x.compressedBytes,0);progress.max=total;const engine=new Engine({executable:'index',canvas:document.getElementById('canvas'),canvasResizePolicy:0,focusCanvas:true,args:[],fileSizes:{'index.pck':manifest.files['index.pck'].bytes,'index.wasm':manifest.files['index.wasm'].bytes},onPrint:console.log,onPrintError:console.error});window.gameEngine=engine;await engine.startGame();document.getElementById('cover').style.display='none';document.getElementById('canvas').focus();window.gameReady=true;console.log('HISTORY_WEB_READY')}catch(e){status.textContent='加载失败：'+e.message+'\n请刷新重试。';button.disabled=false;console.error(e)}};
</script></body></html>
